<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0D111A"/>
  <defs>
    <pattern id="gridForces" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161F2E" stroke-width="0.8"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFB300"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00E5FF"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5E1E"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F8FAFC"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#gridForces)"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2A364F" stroke-width="1.2"/>

  <text x="45" y="60" fill="#F8FAFC" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">THE PRINCIPLE // FLIGHT DYNAMICS EQUILIBRIUM</text>
  <text x="45" y="80" fill="#7E95BC" font-family="monospace" font-size="10">FRAMEWORK: BODY AXIS FIXED AT CG // UNACCELERATED STEADY-STATE LEVEL FLIGHT</text>

  <!-- Center of Gravity (CG) Symbol -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M 0 0 L 16 0 A 16 16 0 0 1 0 16 Z" fill="#F8FAFC"/>
    <path d="M 0 0 L -16 0 A 16 16 0 0 1 0 -16 Z" fill="#F8FAFC"/>
  </g>
  <text x="425" y="315" fill="#7E95BC" font-family="monospace" font-size="10">C.G.</text>

  <!-- Aircraft Silhouette (Minimalist supersonic dart / delta profile) -->
  <path d="M 220 300 L 350 285 L 380 200 L 410 285 L 560 295 L 580 300 L 560 305 L 410 315 L 380 400 L 350 315 Z" fill="#121824" stroke="#2A364F" stroke-width="1.5"/>

  <!-- 1. LIFT VECTOR (UP) -->
  <line x1="400" y1="280" x2="400" y2="100" stroke="#00E5FF" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="415" y="110" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="bold">LIFT (L)</text>
  <text x="415" y="130" fill="#7E95BC" font-family="monospace" font-size="10">L = 1/2 * rho * V^2 * S * cL</text>

  <!-- 2. WEIGHT VECTOR (DOWN) -->
  <line x1="400" y1="320" x2="400" y2="500" stroke="#FF5E1E" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="415" y="490" fill="#FF5E1E" font-family="monospace" font-size="14" font-weight="bold">WEIGHT (W)</text>
  <text x="415" y="510" fill="#7E95BC" font-family="monospace" font-size="10">W = m * g</text>

  <!-- 3. THRUST VECTOR (FORWARD / LEFT) -->
  <line x1="380" y1="300" x2="160" y2="300" stroke="#FFB300" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="160" y="270" fill="#FFB300" font-family="monospace" font-size="14" font-weight="bold">THRUST (T)</text>
  <text x="160" y="288" fill="#7E95BC" font-family="monospace" font-size="10">T = m_dot * (v_e - v_0)</text>

  <!-- 4. DRAG VECTOR (AFT / RIGHT) -->
  <line x1="420" y1="300" x2="640" y2="300" stroke="#F8FAFC" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="560" y="270" fill="#F8FAFC" font-family="monospace" font-size="14" font-weight="bold">DRAG (D)</text>
  <text x="560" y="288" fill="#7E95BC" font-family="monospace" font-size="10">D = 1/2 * rho * V^2 * S * cD</text>

  <!-- Equilibrium Equation Badges -->
  <rect x="45" y="480" width="220" height="50" rx="4" fill="#121824" stroke="#FFB300" stroke-width="1"/>
  <text x="60" y="502" fill="#FFB300" font-family="monospace" font-size="12" font-weight="bold">SUM(F_x) = T - D = 0</text>
  <text x="60" y="520" fill="#00E5FF" font-family="monospace" font-size="12" font-weight="bold">SUM(F_z) = L - W = 0</text>

  <text x="560" y="550" fill="#7E95BC" font-family="monospace" font-size="11">AEROMACH // FIRST PRINCIPLES</text>
</svg>
