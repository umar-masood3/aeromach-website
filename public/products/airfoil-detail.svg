<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0D111A"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#2A364F" stroke-width="1.2"/>
  <text x="50" y="65" fill="#00E5FF" font-family="monospace" font-size="13">PRESSURE DISTRIBUTION // -Cp vs CHORDWISE POSITION (x/c)</text>
  <text x="50" y="85" fill="#7E95BC" font-family="monospace" font-size="10">REYNOLDS NO: 6.0 x 10^6 // MACH 0.15 // ANGLE OF ATTACK alpha = 4.0°</text>

  <!-- Plot Axes -->
  <line x1="120" y1="460" x2="680" y2="460" stroke="#7E95BC" stroke-width="1.5"/>
  <line x1="120" y1="460" x2="120" y2="120" stroke="#7E95BC" stroke-width="1.5"/>
  <text x="690" y="465" fill="#7E95BC" font-family="monospace" font-size="11">x / c</text>
  <text x="80" y="125" fill="#7E95BC" font-family="monospace" font-size="11">-Cp</text>

  <!-- Upper Surface Pressure Suction Peak (Suction Spike) -->
  <path d="M 120 440 Q 150 140 220 200 T 400 340 T 680 450" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <text x="230" y="160" fill="#00E5FF" font-family="monospace" font-size="10">UPPER SURFACE (SUCTION PEAK: -Cp = -2.14)</text>

  <!-- Lower Surface Pressure -->
  <path d="M 120 440 Q 200 420 350 435 T 680 450" fill="none" stroke="#FF5E1E" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="360" y="420" fill="#FF5E1E" font-family="monospace" font-size="10">LOWER SURFACE</text>

  <!-- Hatching between surfaces (Lift Area Integral) -->
  <g stroke="#2A364F" stroke-width="0.8">
    <line x1="200" y1="185" x2="200" y2="420"/>
    <line x1="260" y1="230" x2="260" y2="425"/>
    <line x1="320" y1="275" x2="320" y2="430"/>
    <line x1="380" y1="320" x2="380" y2="435"/>
    <line x1="440" y1="365" x2="440" y2="440"/>
    <line x1="500" y1="400" x2="500" y2="445"/>
  </g>
  <text x="300" y="360" fill="#7E95BC" font-family="monospace" font-size="12">AREA = SECTIONAL LIFT COEFFICIENT (cL = 0.44)</text>

  <text x="50" y="535" fill="#FFB300" font-family="monospace" font-size="11">AEROMACH AERODYNAMICS LAB // FORM FOLLOWS PHYSICS</text>
</svg>
