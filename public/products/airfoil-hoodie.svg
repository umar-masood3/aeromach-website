<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0D111A"/>
  <defs>
    <pattern id="gridAirfoil" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161F2E" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#gridAirfoil)"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2A364F" stroke-width="1.2" stroke-dasharray="6,4"/>

  <text x="45" y="60" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="bold">NACA 0012 // 12% SYMMETRICAL AIRFOIL SECTION</text>
  <text x="45" y="80" fill="#7E95BC" font-family="monospace" font-size="10">COORDINATE THICKNESS DISTRIBUTION: y = ± 0.60 * [0.2969√x - 0.1260x - 0.3516x² + 0.2843x³ - 0.1015x⁴]</text>

  <!-- Chord Line c -->
  <line x1="120" y1="300" x2="680" y2="300" stroke="#7E95BC" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="690" y="304" fill="#7E95BC" font-family="monospace" font-size="10">CHORD (c)</text>

  <!-- NACA 0012 Airfoil Profile -->
  <path d="M 120 300 C 130 200 280 220 400 240 C 520 260 620 290 680 300 C 620 310 520 340 400 360 C 280 380 130 400 120 300 Z" fill="#121824" stroke="#D3DDEB" stroke-width="2.5"/>

  <!-- Streamlines (Upper Surface with acceleration) -->
  <g stroke="#00E5FF" stroke-width="1.2" opacity="0.6">
    <path d="M 60 180 C 140 180 260 110 400 130 C 540 150 640 210 740 220" fill="none"/>
    <path d="M 60 220 C 140 220 240 155 400 175 C 540 195 640 240 740 250" fill="none"/>
    <path d="M 60 260 C 120 260 200 215 360 230 C 500 245 620 275 740 280" fill="none"/>
  </g>

  <!-- Streamlines (Lower Surface) -->
  <g stroke="#7E95BC" stroke-width="1.2" opacity="0.5">
    <path d="M 60 340 C 120 340 200 385 360 370 C 500 355 620 325 740 320" fill="none"/>
    <path d="M 60 380 C 140 380 240 445 400 425 C 540 405 640 360 740 350" fill="none"/>
    <path d="M 60 420 C 140 420 260 490 400 470 C 540 450 640 390 740 380" fill="none"/>
  </g>

  <!-- Boundary Layer Velocity Vectors -->
  <g stroke="#FF5E1E" stroke-width="1.2">
    <!-- Laminar region -->
    <line x1="240" y1="230" x2="240" y2="190"/>
    <line x1="240" y1="230" x2="255" y2="230"/>
    <line x1="240" y1="220" x2="265" y2="220"/>
    <line x1="240" y1="210" x2="275" y2="210"/>
    <line x1="240" y1="200" x2="280" y2="200"/>
    <!-- Transition Point -->
    <circle cx="360" cy="235" r="4" fill="#FFB300"/>
    <text x="340" y="215" fill="#FFB300" font-family="monospace" font-size="9">TRANSITION (Re_crit)</text>
    <!-- Turbulent profile -->
    <line x1="480" y1="250" x2="480" y2="200"/>
    <line x1="480" y1="250" x2="505" y2="250"/>
    <line x1="480" y1="240" x2="515" y2="240"/>
    <line x1="480" y1="230" x2="518" y2="230"/>
    <line x1="480" y1="215" x2="520" y2="215"/>
  </g>

  <!-- Maximum Thickness Callout -->
  <line x1="288" y1="225" x2="288" y2="375" stroke="#FF5E1E" stroke-width="1.5"/>
  <circle cx="288" cy="225" r="3" fill="#FF5E1E"/>
  <circle cx="288" cy="375" r="3" fill="#FF5E1E"/>
  <text x="295" y="280" fill="#FF5E1E" font-family="monospace" font-size="10">t_max = 0.12 c</text>
  <text x="295" y="295" fill="#FF5E1E" font-family="monospace" font-size="9">at x = 0.30 c</text>

  <text x="45" y="540" fill="#7E95BC" font-family="monospace" font-size="11">cL = 2 * pi * alpha // d_cL/d_alpha = 0.11 / deg</text>
  <text x="560" y="540" fill="#00E5FF" font-family="monospace" font-size="11">AEROMACH FLUID DYNAMICS</text>
</svg>
