<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0D111A"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2A364F" stroke-width="1.2"/>

  <!-- Warning Header -->
  <rect x="45" y="45" width="710" height="36" fill="#1A2234" stroke="#FF5E1E" stroke-width="1.2"/>
  <text x="65" y="68" fill="#FF5E1E" font-family="monospace" font-size="12" font-weight="bold">WARNING // NON-LINEAR PARTIAL DIFFERENTIAL EQUATIONS // TURBULENCE IMMINENT</text>

  <!-- Large Navier Stokes Formulation -->
  <g transform="translate(60, 200)">
    <text x="0" y="0" fill="#F8FAFC" font-family="monospace" font-size="28" font-weight="bold">
      ρ ( ∂u/∂t + u · ∇u ) = -∇p + μ ∇²u + f
    </text>
  </g>

  <!-- Term Annotations -->
  <g font-family="monospace" font-size="11">
    <!-- Unsteady -->
    <text x="140" y="250" fill="#00E5FF">↑ UNSTEADY</text>
    <text x="140" y="265" fill="#7E95BC">ACCELERATION</text>

    <!-- Convective -->
    <text x="260" y="250" fill="#FFB300">↑ CONVECTIVE</text>
    <text x="260" y="265" fill="#7E95BC">INERTIA (NON-LINEAR)</text>

    <!-- Pressure Gradient -->
    <text x="440" y="250" fill="#FF5E1E">↑ PRESSURE</text>
    <text x="440" y="265" fill="#7E95BC">GRADIENT</text>

    <!-- Viscous Diffusion -->
    <text x="560" y="250" fill="#00E676">↑ VISCOUS</text>
    <text x="560" y="265" fill="#7E95BC">DIFFUSION (STOKES)</text>
  </g>

  <!-- Turbulence Vortices CAD Graphics -->
  <g stroke="#00E5FF" stroke-width="1.2" opacity="0.6">
    <path d="M 120 400 C 180 340 260 480 340 400 S 500 320 600 420 S 700 350 740 400" fill="none"/>
    <circle cx="280" cy="420" r="25" fill="none" stroke="#FF5E1E" stroke-dasharray="4,4"/>
    <circle cx="280" cy="420" r="12" fill="none" stroke="#FF5E1E"/>
    <circle cx="480" cy="380" r="40" fill="none" stroke="#FFB300" stroke-dasharray="6,4"/>
    <circle cx="480" cy="380" r="20" fill="none" stroke="#FFB300"/>
  </g>

  <!-- Millennium Prize Callout -->
  <rect x="45" y="490" width="710" height="50" fill="#121824" stroke="#2A364F" stroke-width="1"/>
  <text x="65" y="515" fill="#F8FAFC" font-family="monospace" font-size="11">CLAY MATHEMATICS INSTITUTE // MILLENNIUM PROBLEM 04: EXISTENCE AND SMOOTHNESS</text>
  <text x="65" y="530" fill="#7E95BC" font-family="monospace" font-size="10">PRIZE: $1,000,000 USD // STATUS: STILL UNRESOLVED (WEAR THE EQUATION INSTEAD)</text>
</svg>
