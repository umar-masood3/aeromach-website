<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0D111A"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2A364F" stroke-width="1.2"/>
  <text x="45" y="60" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="bold">IN BERNOULLI WE TRUST // VENTURI CONSERVATION OF ENERGY</text>
  <text x="45" y="80" fill="#7E95BC" font-family="monospace" font-size="10">P_1 + 1/2*rho*v_1^2 + rho*g*h_1 = P_2 + 1/2*rho*v_2^2 + rho*g*h_2 = CONSTANT</text>

  <!-- Venturi Tube Walls -->
  <!-- Upper wall -->
  <path d="M 60 220 L 260 220 Q 400 270 450 270 L 500 270 Q 550 270 690 220 L 740 220" fill="none" stroke="#D3DDEB" stroke-width="3"/>
  <!-- Lower wall -->
  <path d="M 60 380 L 260 380 Q 400 330 450 330 L 500 330 Q 550 330 690 380 L 740 380" fill="none" stroke="#D3DDEB" stroke-width="3"/>

  <!-- Streamlines Converging at Throat -->
  <g stroke="#00E5FF" stroke-width="1.2" opacity="0.6">
    <path d="M 60 250 L 260 250 Q 400 280 475 280 Q 550 280 690 250 L 740 250" fill="none"/>
    <path d="M 60 300 L 740 300" stroke-dasharray="8,4" fill="none"/>
    <path d="M 60 350 L 260 350 Q 400 320 475 320 Q 550 320 690 350 L 740 350" fill="none"/>
  </g>

  <!-- Manometer Vertical Pressure Tubes -->
  <!-- Station 1 (Wide, High Pressure, High column h1) -->
  <line x1="200" y1="220" x2="200" y2="120" stroke="#7E95BC" stroke-width="2"/>
  <rect x="195" y="140" width="10" height="80" fill="#FFB300" opacity="0.8"/>
  <text x="160" y="130" fill="#FFB300" font-family="monospace" font-size="11">h_1 (HIGH P_1)</text>
  <text x="160" y="270" fill="#00E5FF" font-family="monospace" font-size="10">v_1 (LOW VELOCITY)</text>

  <!-- Station 2 (Throat, Low Pressure, Low column h2) -->
  <line x1="475" y1="270" x2="475" y2="120" stroke="#7E95BC" stroke-width="2"/>
  <rect x="470" y="195" width="10" height="75" fill="#FF5E1E" opacity="0.8"/>
  <text x="440" y="130" fill="#FF5E1E" font-family="monospace" font-size="11">h_2 (LOW P_2)</text>
  <text x="440" y="315" fill="#00E5FF" font-family="monospace" font-size="10">v_2 (HIGH VELOCITY)</text>

  <!-- Delta h Differential -->
  <line x1="205" y1="140" x2="470" y2="140" stroke="#F8FAFC" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="205" y1="195" x2="470" y2="195" stroke="#F8FAFC" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="340" y1="140" x2="340" y2="195" stroke="#F8FAFC" stroke-width="1.5"/>
  <text x="350" y="172" fill="#F8FAFC" font-family="monospace" font-size="11">Δh = (v_2² - v_1²) / 2g</text>

  <!-- Summary Banner -->
  <rect x="45" y="490" width="710" height="45" fill="#121824" stroke="#2A364F" stroke-width="1"/>
  <text x="65" y="518" fill="#F8FAFC" font-family="monospace" font-size="12">NO PRESSURE, NO DIAMONDS // LESS AREA, MORE VELOCITY // AEROMACH FLUIDS</text>
</svg>
